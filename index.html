<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лут сезона · Raidsmith</title>
  <meta name="description" content="Весь лут текущего сезона WoW Midnight для вашей специализации: подземелья M+, рейды, тир-сет и популярность у топ-игроков.">
  <meta name="theme-color" content="#0a0c12">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preload" href="fonts/ibm-plex-sans-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="filters.css">
  <!-- ponytail: Wowhead tooltips (full item stats on icon hover), kept per design handoff. Async and optional:
       blocked in RU, then the icon is still a plain link. No SRI: the script is unversioned and changes often. -->
  <script>var whTooltips = { colorLinks: false, iconizeLinks: false, renameLinks: false }</script>
  <script src="https://wow.zamimg.com/js/tooltips.js" async></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top-bar">
    <div class="top-bar__crumbs">
      <span class="micro-label">Raidsmith</span>
      <span class="top-bar__sep" aria-hidden="true">/</span>
      <span class="top-bar__section">Лут сезона</span>
    </div>
    <div class="top-bar__right"><span id="patch" class="micro-label tnum"></span></div>
  </header>

  <div class="page">
    <header class="page-head">
      <div class="page-head__brand">
        <h1 class="page-h1">Лут сезона</h1>
        <p id="season" class="page-sub"></p>
      </div>
      <div class="picker">
        <button type="button" id="picker-btn" class="picker__btn" aria-haspopup="dialog" aria-expanded="false" aria-label="Выбрать класс и специализацию"></button>
        <div id="picker-pop" hidden></div>
      </div>
    </header>

    <nav class="tabs" aria-label="Разделы"><div id="tabs" class="tabs__list" role="tablist"></div></nav>

    <div class="layout">
      <aside class="filters" aria-label="Фильтры">
        <input id="q" type="search" class="search" placeholder="Поиск предмета" aria-label="Поиск предмета" autocomplete="off">
        <div id="facets" class="facets"></div>
      </aside>
      <main id="view" class="view"><p class="empty-card">Загрузка…</p></main>
    </div>
  </div>

  <div id="bar"></div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
